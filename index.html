<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control Machine Wash</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header dengan Tombol Toggle Dark/Light Mode -->
        <div class="header-wrapper">
            <h1>SMART CONTROL MACHINE WASH</h1>
            <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()" title="Ubah Tema">
                <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>

        <!-- Mode Selector: BLE vs MQTT -->
        <div class="protocol-selector">
            <label class="protocol-label">
                <input type="radio" name="protocol" value="BLE" onchange="switchProtocol('BLE')">
                <span>BLE (Bluetooth)</span>
            </label>
            <label class="protocol-label">
                <input type="radio" name="protocol" value="MQTT" checked onchange="switchProtocol('MQTT')">
                <span>MQTT (WiFi)</span>
            </label>
        </div>

        <!-- Bar Status BLE & MQTT -->
        <div id="ble-bar" class="status-bar" style="display: none;">
            <div class="status-item">
                <div id="bt-indicator" class="indicator"></div>
                <span id="bt-text">BLE: Terputus</span>
            </div>
            <button id="bt-btn" onclick="toggleBluetooth()">Konek BLE</button>
        </div>

        <div id="mqtt-bar" class="status-bar">
            <div class="status-item">
                <div id="mqtt-indicator" class="indicator"></div>
                <span id="mqtt-text">MQTT: Terputus</span>
            </div>
            <button id="mqtt-btn" onclick="toggleMQTT()">Konek MQTT</button>
        </div>

        <!-- TAMBAHAN: Panel Kontrol Power Utama AC (220V) -->
        <div class="control-group">
            <div class="section-title">POWER UTAMA AC (220V)</div>
            <div class="button-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button class="strength-card" style="background-color: #27ae60; color: white;" onclick="sendPower('ON')">
                    <span>POWER ON</span>
                </button>
                <button class="strength-card" style="background-color: #7f8c8d; color: white;" onclick="sendPower('OFF')">
                    <span>POWER OFF</span>
                </button>
            </div>
        </div>

        <!-- Display Waktu Sisa, Proses, Waktu Proses -->
        <div class="display-section">
            <div class="card-box">
                <div class="label">Waktu Sisa</div>
                <div id="timer-display" class="value">00:00</div>
            </div>
            <div class="card-box">
                <div class="label">Proses</div>
                <div id="process-display" class="value">STANDBY</div>
            </div>
            <div class="card-box">
                <div class="label">Waktu Proses</div>
                <div id="elapsed-display" class="value">00:00</div>
            </div>
        </div>

        <!-- Mode Kekuatan Pencucian dengan Ikon Visual -->
        <div class="control-group">
            <div class="section-title">MODE KEKUATAN PENCUCIAN</div>
            <div class="strength-grid">
                <button class="strength-card" onclick="selectMode('SOFT', this)">
                    <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L3 13.5V21h7.5l9.74-9.76z"></path>
                        <line x1="16" y1="8" x2="2" y2="22"></line>
                    </svg>
                    <span>SOFT</span>
                </button>

                <button class="strength-card active" onclick="selectMode('STANDARD', this)">
                    <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                    </svg>
                    <span>STANDARD</span>
                </button>

                <button class="strength-card" onclick="selectMode('STRONG', this)">
                    <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"></path>
                    </svg>
                    <span>STRONG</span>
                </button>

                <button class="strength-card" onclick="selectMode('SPEED', this)">
                    <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="8"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                        <path d="M12 2v2"></path>
                    </svg>
                    <span>SPEED</span>
                </button>
            </div>
        </div>

        <!-- Slider Waktu Proses -->
        <div class="slider-container">
            <div class="slider-header">
                <span>DURASI PROSES (MAX 15 MENIT)</span>
                <span id="slider-val">450 Detik (07:30)</span>
            </div>
            <input type="range" id="control-slider" min="1" max="900" value="450" oninput="updateSlider(this.value)" onchange="sendSliderData(this.value)">
        </div>

        <!-- Panel Eksekusi Tombol Bulat Bergambar -->
        <div class="main-control-panel">
            <div class="section-title">EKSEKUSI UTAMA</div>
            <div class="circle-buttons-grid">
                <button id="wash-btn" class="circle-btn action-btn" onclick="triggerAction('WASH')">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                    </svg>
                    <span>WASH</span>
                </button>

                <button id="spin-btn" class="circle-btn action-btn" onclick="triggerAction('SPIN')">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
                    </svg>
                    <span>SPIN</span>
                </button>

                <button class="circle-btn auto-btn exec-btn active" onclick="selectMode('AUTO', this)">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                    <span>AUTO</span>
                </button>

                <button class="circle-btn stop-btn exec-btn" onclick="selectMode('STOP', this)">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="6" y="6" width="12" height="12" rx="2"></rect>
                    </svg>
                    <span>STOP</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Pop-up Modal Notifikasi Selesai -->
    <div id="finish-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-icon">🔔</div>
            <h2>NOTIFIKASI TAHAP</h2>
            <p>Pesan notifikasi...</p>
            <button class="modal-btn" onclick="closeFinishModal()">TUTUP</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
