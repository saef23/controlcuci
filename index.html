<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontrol Mesin Cuci MQTT</title>
    <link rel="stylesheet" href="style.css">
    <!-- Paho MQTT Web Client -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>Smart Washer Dashboard</h2>
        <div class="connection-status" id="statusKoneksi">MQTT: OFF</div>
    </div>

    <!-- MAIN MONITORING RING DISPLAY -->
    <div class="ring-container">
        <svg class="progress-ring" width="200" height="200">
            <circle class="progress-ring-bg" stroke="#2a2a2a" stroke-width="12" fill="transparent" r="85" cx="100" cy="100"/>
            <circle class="progress-ring-circle" id="circleProgress" stroke="#00e676" stroke-width="12" stroke-dasharray="534" stroke-dashoffset="534" stroke-linecap="round" fill="transparent" r="85" cx="100" cy="100"/>
        </svg>
        <div class="ring-content">
            <span class="step-label" id="namaProsesAktif">STANDBY</span>
            <span class="step-timer" id="prosesStepTimer">0s</span>
            <span class="lap-timer" id="totalLapTimer">Total: 00:00</span>
        </div>
    </div>

    <!-- HARDWARE MONITORING GRID (WATER LEVEL & RELAY) -->
    <div class="hardware-grid">
        <div class="hw-item" id="hwWater">
            <span class="hw-title">WATER</span>
            <span class="hw-status" id="statusWaterVal">-</span>
        </div>
        <div class="hw-item" id="hwInlet">
            <span class="hw-title">INLET</span>
            <span class="hw-status" id="statusInletVal">OFF</span>
        </div>
        <div class="hw-item" id="hwDrain">
            <span class="hw-title">DRAIN</span>
            <span class="hw-status" id="statusDrainVal">OFF</span>
        </div>
        <div class="hw-item" id="hwMotor">
            <span class="hw-title">MOTOR</span>
            <span class="hw-status" id="statusMotorVal">OFF</span>
        </div>
    </div>

    <!-- TOMBOL KONEKSI MQTT -->
<button class="btn-connect" onclick="connectMQTT()">hubungkan ke MQTT</button>

    <h3>PILIH MODE CUCI</h3>
    <div class="circle-buttons-grid">
        <div class="circle-btn-wrapper" onclick="kirimPerintah('CMD:1')">
            <button class="btn-circle btn-mode1">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4M12.5,7V12.25L16.5,14.75L15.75,15.85L11,13V7H12.5Z"/></svg>
            </button>
            <span class="btn-label">Cepat (5m)</span>
        </div>

        <div class="circle-btn-wrapper" onclick="kirimPerintah('CMD:2')">
            <button class="btn-circle btn-mode2">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.5 2 2 6.5 2 12S6.5 22 12 22 22 17.5 22 12 17.5 2 12 2M10 17L5 12L6.41 10.59L10 14.17L17.59 6.58L19 8L10 17Z"/></svg>
            </button>
            <span class="btn-label">Normal (10m)</span>
        </div>

        <div class="circle-btn-wrapper" onclick="kirimPerintah('CMD:3')">
            <button class="btn-circle btn-mode3">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 22,12.5V13A10,10 0 0,1 12,23A10,10 0 0,1 2,13V12.5A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12V12.5A8,8 0 0,0 12,20A8,8 0 0,0 20,12.5V12A8,8 0 0,0 12,4M11,7H13V13H11V7M11,15H13V17H11V15Z"/></svg>
            </button>
            <span class="btn-label">Berat (15m)</span>
        </div>

        <div class="circle-btn-wrapper" onclick="kirimPerintah('CMD:4')">
            <button class="btn-circle btn-spin">
                <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12,6V9L16,5L12,1V4A8,8 0 0,0 4,12C4,13.57 4.46,15.03 5.24,16.26L6.7,14.8C6.25,13.97 6,13.01 6,12A6,6 0 0,1 12,6M18.76,7.74L17.3,9.2C17.75,10.03 18,10.99 18,12A6,6 0 0,1 12,18V15L8,19L12,23V20A8,8 0 0,0 20,12C20,10.43 19.54,8.97 18.76,7.74Z"/></svg>
            </button>
            <span class="btn-label">Spin Only</span>
        </div>
    </div>

    <!-- Tombol Stop Darurat -->
    <button class="btn-stop" onclick="kirimPerintah('CMD:STOP')">STOP DARURAT (X)</button>

    <div class="log-box" id="logTerminal">
        [System] Menunggu koneksi MQTT...<br>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
