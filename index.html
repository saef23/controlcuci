<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control Machine Wash</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>SMART CONTROL MACHINE WASH</h1>

        <!-- Mode Selector: BLE vs MQTT -->
        <div class="protocol-selector">
            <label class="protocol-label">
                <input type="radio" name="protocol" value="BLE" onchange="switchProtocol('BLE')">
                <span>BLE (Bluetooth)</span>
            </label>
            <label class="protocol-label">
                <input type="radio" name="protocol" value="MQTT" checked onchange="switchProtocol('MQTT')">
                <span>MQTT (WiFi)</span>
            </label>
        </div>

        <!-- Bar Status BLE & MQTT -->
        <div id="ble-bar" class="status-bar" style="display: none;">
            <div class="status-item">
                <div id="bt-indicator" class="indicator"></div>
                <span id="bt-text">BLE: Terputus</span>
            </div>
            <button id="bt-btn" onclick="toggleBluetooth()">Konek BLE</button>
        </div>

        <div id="mqtt-bar" class="status-bar">
            <div class="status-item">
                <div id="mqtt-indicator" class="indicator"></div>
                <span id="mqtt-text">MQTT: Terputus</span>
            </div>
            <button id="mqtt-btn" onclick="toggleMQTT()">Konek MQTT</button>
        </div>

        <!-- Display Waktu Sisa, Proses, Waktu Proses -->
        <div class="display-section">
            <div class="card-box">
                <div class="label">Waktu Sisa</div>
                <div id="timer-display" class="value">00:00</div>
            </div>
            <div class="card-box">
                <div class="label">Proses</div>
                <div id="process-display" class="value">STANDBY</div>
            </div>
            <div class="card-box">
                <div class="label">Waktu Proses</div>
                <div id="elapsed-display" class="value">00:00</div>
            </div>
        </div>

        <!-- Mode Pencucian -->
        <div class="control-group">
            <div class="section-title">Mode Pencucian</div>
            
            <div class="modes-wrapper">
                <div class="side-modes">
                    <button class="mode-btn strength-btn" onclick="selectMode('SOFT', this)">SOFT</button>
                    <button class="mode-btn strength-btn" onclick="selectMode('STRONG', this)">STRONG</button>
                </div>

                <div class="center-modes">
                    <button class="mode-btn center-btn auto-btn exec-btn active" onclick="selectMode('AUTO', this)">AUTO</button>
                    <button class="mode-btn center-btn stop-btn exec-btn" onclick="selectMode('STOP', this)">STOP</button>
                </div>

                <div class="side-modes">
                    <button class="mode-btn strength-btn active" onclick="selectMode('STANDARD', this)">STANDARD</button>
                    <button class="mode-btn strength-btn" onclick="selectMode('SPEED', this)">SPEED</button>
                </div>
            </div>
        </div>

        <!-- Slider Waktu Proses (15 Menit / 900 Detik) -->
        <div class="slider-container">
            <div class="slider-header">
                <span>DURASI PROSES (MAX 15 MENIT)</span>
                <span id="slider-val">450 Detik (07:30)</span>
            </div>
            <input type="range" id="control-slider" min="1" max="900" value="450" oninput="updateSlider(this.value)" onchange="sendSliderData(this.value)">
        </div>

        <!-- Tombol Utama WASH & SPIN -->
        <div class="action-buttons">
            <button id="wash-btn" class="action-btn" onclick="triggerAction('WASH')">WASH</button>
            <button id="spin-btn" class="action-btn" onclick="triggerAction('SPIN')">SPIN</button>
        </div>
    </div>

    <!-- Pop-up Modal Notifikasi Selesai -->
    <div id="finish-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-icon">🎉</div>
            <h2>PROSES SELESAI!</h2>
            <p>Seluruh tahapan mesin cuci telah tuntas dikerjakan secara aman dan kembali ke posisi STANDBY.</p>
            <button class="modal-btn" onclick="closeFinishModal()">TUTUP</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
