<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Washing Machine</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>Kontrol Mesin Cuci</h2>
        <div id="statusLabel">STATUS: IDLE</div>
        
        <div class="btn-group">
            <button onclick="sendCommand('MANUAL:SPEEDY')">Speedy</button>
            <button onclick="sendCommand('MANUAL:STANDARD')">Standard</button>
            <button onclick="sendCommand('MANUAL:STRONG')">Strong</button>
            <button onclick="sendCommand('MANUAL:SOFT')">Soft</button>
        </div>
        
        <button class="btn-stop" onclick="sendCommand('MODE:STOP')">STOP</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
