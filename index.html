<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Washing Machine Control</title>
    <link rel="stylesheet" href="style.css">
    <!-- MQTT Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Smart Washing Machine</h1>
        
        <!-- Status Box -->
        <div id="status-box" class="status-idle">
            Status: <span id="statusLabel">IDLE</span>
        </div>

        <!-- Bagian Kontrol Daya Utama AC (220V) -->
        <div class="card-section">
            <h2>Power Utama AC (220V)</h2>
            <div class="button-grid">
                <button class="btn btn-power-on" onclick="sendPower('ON')">POWER ON</button>
                <button class="btn btn-power-off" onclick="sendPower('OFF')">POWER OFF</button>
            </div>
        </div>

        <!-- Bagian Pilihan Profil Cucian (Manual Mode + Profil) -->
        <div class="card-section">
            <h2>Pilih Jenis Cucian (Manual Mode)</h2>
            <div class="button-grid">
                <button class="btn profile-speedy" onclick="sendProfile('SPEEDY')">Speedy (Cepat)</button>
                <button class="btn profile-standard" onclick="sendProfile('STANDARD')">Standard (Harian)</button>
                <button class="btn profile-strong" onclick="sendProfile('STRONG')">Strong (Kuat/Kotor)</button>
                <button class="btn profile-soft" onclick="sendProfile('SOFT')">Soft (Lembut)</button>
            </div>
        </div>

        <!-- Bagian Kontrol Manual Tahap / Aksi Tambahan -->
        <div class="card-section">
            <h2>Kontrol Tahap Manual</h2>
            <div class="button-grid">
                <button class="btn btn-action" onclick="sendAction('DRAIN')">Buang Air (Drain)</button>
                <button class="btn btn-action" onclick="sendAction('SPIN')">Peras (Spin)</button>
            </div>
        </div>

        <!-- Bagian Tombol Darurat -->
        <div class="emergency-section">
            <button class="btn btn-stop" onclick="stopMachine()">STOP / DARURAT</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
